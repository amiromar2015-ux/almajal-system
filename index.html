<head>

<title>نظام المجال العربي</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --orange:#e8640a;
  --orange2:#c9530a;
  --orange-light:#fff4ee;
  --bg:#f5f6fa;
  --bg2:#ffffff;
  --border:#e8eaed;
  --text:#1a1a2e;
  --text2:#4a4a6a;
  --text3:#8888aa;
  --green:#059669;
  --red:#e11d48;
  --blue:#0284c7;
  --gold:#b8892a;
  --font:'Almarai',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);direction:rtl;min-height:100vh;}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e);}
.login-box{background:#fff;border-radius:24px;padding:48px 40px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.login-logo{height:60px;margin-bottom:24px;}
.login-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:6px;}
.login-sub{font-size:12px;color:var(--text3);margin-bottom:32px;}
.login-inp{width:100%;padding:14px 18px;border:2px solid var(--border);border-radius:12px;font-family:var(--font);font-size:14px;text-align:center;margin-bottom:16px;transition:border .2s;}
.login-inp:focus{outline:none;border-color:var(--orange);}
.login-btn{width:100%;padding:14px;background:var(--orange);color:#fff;border:none;border-radius:12px;font-family:var(--font);font-size:15px;font-weight:800;cursor:pointer;transition:background .2s;}
.login-btn:hover{background:var(--orange2);}
.login-err{color:var(--red);font-size:12px;margin-top:8px;opacity:0;transition:opacity .3s;}

/* HEADER */
.header{background:#fff;border-bottom:3px solid var(--orange);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.header-inner{max-width:1200px;margin:0 auto;padding:0 20px;}
.header-top{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px;}
.logo-area{display:flex;align-items:center;gap:12px;}
.logo-img{height:44px;object-fit:contain;}
.header-kpis{display:flex;gap:10px;align-items:center;}
.kpi-pill{background:var(--orange-light);border:1px solid rgba(232,100,10,0.2);border-radius:50px;padding:6px 16px;text-align:center;}
.kpi-label{font-size:9px;color:var(--text3);display:block;}
.kpi-val{font-weight:800;font-size:13px;color:var(--orange);}
.header-actions{display:flex;gap:8px;}
.btn-icon{background:none;border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px;color:var(--text2);font-family:var(--font);transition:all .2s;}
.btn-icon:hover{border-color:var(--orange);color:var(--orange);}

/* TABS */
.tabs{display:flex;gap:0;overflow-x:auto;border-top:1px solid var(--border);}
.tab{padding:10px 16px;background:none;border:none;border-bottom:3px solid transparent;color:var(--text3);font-family:var(--font);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .2s;}
.tab.active{border-bottom-color:var(--orange);color:var(--orange);}
.tab:hover{color:var(--text2);}

/* MAIN */
.main{max-width:1200px;margin:0 auto;padding:24px 20px 100px;}

/* CARDS */
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,0.05);}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px 24px;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--accent,var(--orange));}
.stat-label{font-size:11px;color:var(--text3);margin-bottom:8px;}
.stat-val{font-size:22px;font-weight:800;color:var(--text);}
.stat-sub{font-size:11px;color:var(--text3);margin-top:4px;}

/* TABLE */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead{background:#f8f9fb;}
th{padding:12px 14px;text-align:right;color:var(--text3);font-weight:700;font-size:11px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:12px 14px;border-bottom:1px solid rgba(0,0,0,0.04);color:var(--text);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafbfc;}

/* BUTTONS */
.btn{padding:10px 20px;border-radius:10px;border:none;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-primary{background:var(--orange);color:#fff;}
.btn-primary:hover{background:var(--orange2);}
.btn-secondary{background:#f1f5f9;color:var(--text2);}
.btn-secondary:hover{background:#e2e8f0;}
.btn-danger{background:#fee2e2;color:var(--red);}
.btn-sm{padding:6px 14px;font-size:12px;}

/* INPUTS */
.inp{width:100%;background:#f8fafc;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-family:var(--font);font-size:13px;direction:rtl;transition:border .2s;}
.inp:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px rgba(232,100,10,0.1);}
.sel{width:100%;background:#f8fafc;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-family:var(--font);font-size:13px;direction:rtl;cursor:pointer;appearance:none;}
.sel:focus{border-color:var(--orange);outline:none;}
.lbl{font-size:11px;color:var(--text3);margin-bottom:5px;display:block;font-weight:700;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:20px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;}
.modal-title{font-size:16px;font-weight:800;}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);padding:4px 8px;}
.modal-body{padding:24px;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}
.form-group{margin-bottom:16px;}

/* BADGE */
.badge{display:inline-block;padding:3px 10px;border-radius:50px;font-size:11px;font-weight:700;}
.badge-green{background:#d1fae5;color:#059669;}
.badge-orange{background:#ffedd5;color:#c2410c;}
.badge-red{background:#fee2e2;color:#dc2626;}
.badge-blue{background:#dbeafe;color:#1d4ed8;}
.badge-gray{background:#f1f5f9;color:#64748b;}

/* ALERTS */
.alert-bar{background:var(--orange-light);border:1px solid rgba(232,100,10,0.25);border-radius:12px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;gap:10px;cursor:pointer;}

/* SEARCH */
.search-bar{display:flex;gap:10px;align-items:center;margin-bottom:20px;}
.search-inp{flex:1;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px 16px;font-family:var(--font);font-size:13px;}
.search-inp:focus{outline:none;border-color:var(--orange);}

/* SECTION HEADER */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.section-title{font-size:16px;font-weight:800;color:var(--text);}

/* LOADING */
.loading{text-align:center;padding:60px;color:var(--text3);}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* EMPTY */
.empty{text-align:center;padding:60px;color:var(--text3);}
.empty-icon{font-size:48px;margin-bottom:16px;}

@media(max-width:768px){
  .grid4{grid-template-columns:1fr 1fr;}
  .grid3{grid-template-columns:1fr;}
  .header-kpis{display:none;}
  .tab{padding:8px 10px;font-size:11px;}
}
</style>
</head>

<script>
// ============================================
// SUPABASE CONFIG
// ============================================
const SUPABASE_URL = 'https://gdnahdxrxrutaeuutijb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_hDLdjSBZhPWiorE_m0i-WA_nPxxDbx9';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================
// AUTH
// ============================================
const PASS = 'almajal2026';
const AUTH_KEY = 'mag_auth';

function doLogin() {
  const p = document.getElementById('pass-inp').value;
  if(p === PASS) {
    sessionStorage.setItem(AUTH_KEY, '1');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    const err = document.getElementById('login-err');
    err.style.opacity = '1';
    setTimeout(()=>err.style.opacity='0', 2500);
    document.getElementById('pass-inp').value = '';
  }
}

function doLogout() {
  sessionStorage.removeItem(AUTH_KEY);
  location.reload();
}

document.addEventListener('DOMContentLoaded', () => {
  if(sessionStorage.getItem(AUTH_KEY) === '1') {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  }
  document.getElementById('pass-inp')?.addEventListener('keydown', e => {
    if(e.key === 'Enter') doLogin();
  });
});

// ============================================
// TABS
// ============================================
const TABS = [
  {k:'dashboard', lb:'🏠 الرئيسية'},
  {k:'invoices', lb:'🧾 الفواتير'},
  {k:'projects', lb:'📁 المشاريع'},
  {k:'custodies', lb:'📋 العهد'},
  {k:'contracts', lb:'🏠 العقود'},
  {k:'employees', lb:'👥 الموظفين'},
  {k:'suppliers', lb:'🏪 الموردين'},
  {k:'extracts', lb:'📑 المستخلصات'},
  {k:'deducts', lb:'📊 كشوف التخفيض'},
  {k:'vehicles', lb:'🚗 المركبات'},
  {k:'assets', lb:'🏗️ الأصول'},
  {k:'purchases', lb:'🛒 طلبات الشراء'},
  {k:'items', lb:'📦 المخزون'},
  {k:'reports', lb:'📈 التقارير'},
  {k:'monthly_report', lb:'📅 التقرير الشهري'},
  {k:'emp_report', lb:'👤 تقرير الموظفين'},
];

let currentTab = 'dashboard';

function renderTabs() {
  document.getElementById('tabs-bar').innerHTML = TABS.map(t =>
    `<button class="tab ${t.k===currentTab?'active':''}" onclick="switchTab('${t.k}')">${t.lb}</button>`
  ).join('');
}

function switchTab(k) {
  currentTab = k;
  renderTabs();
  renderMain();
}

// ============================================
// DATA
// ============================================
let DATA = {
  projects:[], lines:[], invoices:[], employees:[],
  custodies:[], contracts:[], extracts:[], deduct_statements:[],
  vehicles:[], suppliers:[], assets:[], purchase_requests:[], items:[],
  supplier_files:[], contract_files:[], employee_files:[]
};

async function loadAll() {
  const tables = Object.keys(DATA);
  await Promise.all(tables.map(async t => {
    const { data, error } = await sb.from(t).select('*').order('created_at', {ascending:false});
    if(!error && data) DATA[t] = data;
  }));
}

async function syncData() {
  const btn = event?.target;
  if(btn) btn.textContent = '⏳ جاري الحفظ...';
  await loadAll();
  renderMain();
  updateKPIs();
  if(btn) btn.textContent = '☁️ حفظ';
  showToast('✅ تم تحديث البيانات');
}

// ============================================
// UTILS
// ============================================
const SAR = 'ر.س';
function fmt(n) { return (n||0).toLocaleString('ar-SA', {minimumFractionDigits:0, maximumFractionDigits:2}); }
function uid() { return crypto.randomUUID(); }
function today() { return new Date().toISOString().split('T')[0]; }

function showToast(msg, type='success') {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:${type==='error'?'#dc2626':'#059669'};color:#fff;padding:12px 24px;border-radius:12px;font-family:var(--font);font-weight:700;z-index:9999;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,0.2);`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function openModal(html) {
  document.getElementById('modals').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">${html}</div>`;
}

function closeModal() {
  document.getElementById('modals').innerHTML = '';
}

// ============================================
// KPIs
// ============================================
function updateKPIs() {
  const totalInvoices = DATA.invoices.reduce((s,i)=>s+(i.total||0),0);
  const thisMonth = new Date().toISOString().slice(0,7);
  const monthInvoices = DATA.invoices.filter(i=>i.date?.startsWith(thisMonth)).reduce((s,i)=>s+(i.total||0),0);
  const openCustodies = DATA.custodies.filter(c=>c.status==='open').length;
  document.getElementById('header-kpis').innerHTML = `
    <div class="kpi-pill"><span class="kpi-label">إجمالي الفواتير</span><span class="kpi-val">${fmt(totalInvoices)} ${SAR}</span></div>
    <div class="kpi-pill"><span class="kpi-label">هذا الشهر</span><span class="kpi-val">${fmt(monthInvoices)} ${SAR}</span></div>
    <div class="kpi-pill"><span class="kpi-label">عهد مفتوحة</span><span class="kpi-val">${openCustodies}</span></div>
  `;
}

// ============================================
// GLOBAL SEARCH
// ============================================
function doGlobalSearch(q) {
  const box = document.getElementById('search-results');
  if(!box) return;
  q = q.trim();
  if(q.length < 2) { box.innerHTML = ''; box.style.display='none'; return; }
  box.style.display = 'block';
  const results = [];
  const qL = q.toLowerCase();
  const match = str => str && str.toString().toLowerCase().includes(qL);

  DATA.projects.forEach(r => { if(match(r.name)||match(r.location)) results.push({icon:'📁', label:r.name, sub:'مشروع · '+( r.location||''), tab:'projects'}); });
  DATA.employees.forEach(r => { if(match(r.name)||match(r.iqama)||match(r.job_title)) results.push({icon:'👤', label:r.name, sub:'موظف · '+(r.job_title||''), tab:'employees'}); });
  DATA.suppliers.forEach(r => { if(match(r.name)||match(r.phone)) results.push({icon:'📦', label:r.name, sub:'مورد · '+(r.phone||''), tab:'suppliers'}); });
  DATA.contracts.forEach(r => { if(match(r.name)||match(r.landlord)) results.push({icon:'🏠', label:r.name, sub:'عقد · '+(r.landlord||''), tab:'contracts'}); });
  DATA.vehicles.forEach(r => { if(match(r.plate_number)||match(r.vehicle_type)) results.push({icon:'🚗', label:r.plate_number, sub:'مركبة · '+(r.vehicle_type||''), tab:'vehicles'}); });
  DATA.assets.forEach(r => { if(match(r.name)||match(r.serial_number)) results.push({icon:'🖥️', label:r.name, sub:'أصل · '+(r.serial_number||''), tab:'assets'}); });
  DATA.custodies.forEach(r => { if(match(r.employee_name)||match(r.description)) results.push({icon:'📋', label:r.employee_name, sub:'عهدة · '+fmt(r.amount)+' '+SAR, tab:'custodies'}); });
  DATA.invoices.forEach(r => { if(match(r.invoice_no)||match(r.supplier_name)) results.push({icon:'🧾', label:r.invoice_no||r.supplier_name, sub:'فاتورة · '+fmt(r.total)+' '+SAR, tab:'invoices'}); });

  if(results.length===0){
    box.innerHTML='<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px;">لا توجد نتائج</div>';
    return;
  }
  box.innerHTML = results.slice(0,10).map(r=>`
    <div onclick="switchTab('${r.tab}');document.getElementById('global-search').value='';document.getElementById('search-results').style.display='none';"
      style="display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s;"
      onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''">
      <span style="font-size:20px;">${r.icon}</span>
      <div>
        <div style="font-weight:700;font-size:13px;">${r.label}</div>
        <div style="font-size:11px;color:var(--text3);">${r.sub}</div>
      </div>
    </div>`).join('') + (results.length>10?`<div style="padding:8px;text-align:center;font-size:12px;color:var(--text3);">+${results.length-10} نتيجة أخرى</div>`:'');
}

function dashboardHTML() {
  const totalInv = DATA.invoices.reduce((s,i)=>s+(i.total||0),0);
  const now = new Date();
  const thisMonth = now.toISOString().slice(0,7);
  const lastMonth = new Date(now.getFullYear(), now.getMonth()-1, 1).toISOString().slice(0,7);
  const monthInv = DATA.invoices.filter(i=>i.date?.startsWith(thisMonth)).reduce((s,i)=>s+(i.total||0),0);
  const lastMonthInv = DATA.invoices.filter(i=>i.date?.startsWith(lastMonth)).reduce((s,i)=>s+(i.total||0),0);
  const monthDiff = lastMonthInv ? ((monthInv-lastMonthInv)/lastMonthInv*100).toFixed(1) : null;
  const openCust = DATA.custodies.filter(c=>c.status==='open').reduce((s,c)=>s+(c.amount||0),0);
  const openCustCount = DATA.custodies.filter(c=>c.status==='open').length;
  const pendExtr = DATA.extracts.filter(e=>e.status==='pending').reduce((s,e)=>s+(e.amount||0),0);
  const activeProjects = DATA.projects.filter(p=>p.status==='active').length;
  const totalSalaries = DATA.employees.filter(e=>e.status==='active'||!e.status).reduce((s,e)=>s+(e.salary||0),0);

  // === تنبيهات محسّنة ===
  const alertsUrgent = [], alertsNormal = [];
  DATA.contracts.forEach(c => {
    if(!c.payment_day) return;
    const nextPay = new Date(now.getFullYear(), now.getMonth(), c.payment_day);
    if(nextPay < now) nextPay.setMonth(nextPay.getMonth()+1);
    const diff = Math.ceil((nextPay-now)/86400000);
    if(diff <= 3) alertsUrgent.push({icon:'🚨', color:'#e11d48', bg:'#fff1f2', text:`إيجار "<b>${c.name}</b>" — ${fmt(c.payment_amount)} ${SAR}`, sub:`متأخر أو بعد ${diff} يوم فقط!`, action:`switchTab('contracts')`});
    else if(diff <= 7) alertsNormal.push({icon:'⚠️', color:'#d97706', bg:'#fffbeb', text:`إيجار "<b>${c.name}</b>" — ${fmt(c.payment_amount)} ${SAR}`, sub:`موعد السداد بعد ${diff} أيام`, action:`switchTab('contracts')`});
  });
  DATA.contracts.forEach(c => {
    if(!c.end_date) return;
    const diff = Math.ceil((new Date(c.end_date)-now)/86400000);
    if(diff >= 0 && diff <= 30) alertsNormal.push({icon:'📅', color:'#7c3aed', bg:'#f5f3ff', text:`عقد "<b>${c.name}</b>" ينتهي قريباً`, sub:`${diff} يوم متبقي (${c.end_date})`, action:`switchTab('contracts')`});
  });
  DATA.custodies.filter(c=>c.status==='open').forEach(c => {
    const days = Math.floor((now-new Date(c.created_at||now))/86400000);
    if(days > 60) alertsUrgent.push({icon:'💰', color:'#e11d48', bg:'#fff1f2', text:`عهدة "<b>${c.employee_name}</b>" — ${fmt(c.amount)} ${SAR}`, sub:`مفتوحة منذ ${days} يوم`, action:`switchTab('custodies')`});
    else if(days > 30) alertsNormal.push({icon:'📋', color:'#d97706', bg:'#fffbeb', text:`عهدة "<b>${c.employee_name}</b>" — ${fmt(c.amount)} ${SAR}`, sub:`مفتوحة منذ ${days} يوم`, action:`switchTab('custodies')`});
  });
  const allAlerts = [...alertsUrgent, ...alertsNormal];

  // === مصاريف آخر 6 أشهر ===
  const months6 = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = d.toISOString().slice(0,7);
    const label = d.toLocaleDateString('ar-SA',{month:'short', year:'2-digit'});
    const val = DATA.invoices.filter(inv=>inv.date?.startsWith(key)).reduce((s,inv)=>s+(inv.total||0),0);
    months6.push({key,label,val});
  }
  const maxVal = Math.max(...months6.map(m=>m.val), 1);

  const recentInvoices = DATA.invoices.slice(0,5);

  return `
    ${allAlerts.length ? `
    <div style="margin-bottom:20px;">
      <div style="font-weight:800;font-size:14px;margin-bottom:10px;color:var(--text2);">🔔 تنبيهات تحتاج انتباهك (${allAlerts.length})</div>
      ${allAlerts.map(a=>`
        <div onclick="${a.action}" style="cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px;background:${a.bg};border-right:4px solid ${a.color};border-radius:10px;margin-bottom:8px;transition:opacity .2s;" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
          <span style="font-size:22px;">${a.icon}</span>
          <div style="flex:1;">
            <div style="font-size:13px;font-weight:700;color:${a.color};">${a.text}</div>
            <div style="font-size:12px;color:var(--text3);">${a.sub}</div>
          </div>
          <span style="font-size:12px;color:${a.color};font-weight:700;">عرض ←</span>
        </div>`).join('')}
    </div>` : ''}

    <div class="grid4" style="margin-bottom:24px;">
      <div class="stat-card" style="--accent:var(--orange);">
        <div class="stat-label">إجمالي الفواتير</div>
        <div class="stat-val">${fmt(totalInv)}</div>
        <div class="stat-sub">${SAR}</div>
      </div>
      <div class="stat-card" style="--accent:#059669;">
        <div class="stat-label">فواتير هذا الشهر</div>
        <div class="stat-val">${fmt(monthInv)}</div>
        <div class="stat-sub">${monthDiff !== null ? `<span style="color:${monthDiff>=0?'#059669':'#e11d48'}">${monthDiff>=0?'▲':'▼'} ${Math.abs(monthDiff)}% عن الشهر الماضي</span>` : SAR}</div>
      </div>
      <div class="stat-card" style="--accent:#7c3aed;">
        <div class="stat-label">عهد مفتوحة</div>
        <div class="stat-val">${fmt(openCust)}</div>
        <div class="stat-sub">${openCustCount} عهدة · ${SAR}</div>
      </div>
      <div class="stat-card" style="--accent:#0284c7;">
        <div class="stat-label">مستخلصات معلقة</div>
        <div class="stat-val">${fmt(pendExtr)}</div>
        <div class="stat-sub">${SAR}</div>
      </div>
    </div>

    <div class="grid2" style="margin-bottom:24px;">
      <div class="card">
        <div class="section-title" style="margin-bottom:16px;">📊 مصاريف آخر 6 أشهر</div>
        <div style="display:flex;align-items:flex-end;gap:8px;height:120px;">
          ${months6.map(m=>{
            const pct = maxVal ? (m.val/maxVal*100) : 0;
            const isThis = m.key===thisMonth;
            return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
              <div style="font-size:10px;color:var(--text3);font-weight:600;">${pct>0?fmt(m.val/1000)+'k':''}</div>
              <div style="width:100%;background:${isThis?'var(--orange)':'var(--border)'};border-radius:6px 6px 0 0;height:${Math.max(pct,4)}%;transition:height .5s;position:relative;" title="${m.label}: ${fmt(m.val)} ${SAR}"></div>
              <div style="font-size:10px;color:${isThis?'var(--orange)':'var(--text3)'};font-weight:${isThis?'800':'400'};white-space:nowrap;">${m.label}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-bottom:16px;">📌 ملخص سريع</div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          ${[
            {icon:'📁', label:'مشاريع نشطة', val:activeProjects+' مشروع', color:'var(--orange)'},
            {icon:'👥', label:'الموظفين النشطين', val:DATA.employees.filter(e=>e.status==='active'||!e.status).length+' موظف', color:'#059669'},
            {icon:'💵', label:'إجمالي الرواتب', val:fmt(totalSalaries)+' '+SAR, color:'#7c3aed'},
            {icon:'🚗', label:'المركبات', val:DATA.vehicles.length+' مركبة', color:'#0284c7'},
            {icon:'🏠', label:'العقود النشطة', val:DATA.contracts.length+' عقد', color:'#d97706'},
            {icon:'📦', label:'الموردين', val:DATA.suppliers.length+' مورد', color:'#059669'},
          ].map(r=>`
            <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg);border-radius:8px;">
              <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);">
                <span>${r.icon}</span><span>${r.label}</span>
              </div>
              <span style="font-weight:800;font-size:13px;color:${r.color};">${r.val}</span>
            </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-header"><div class="section-title">🧾 آخر الفواتير</div><button class="btn btn-secondary btn-sm" onclick="switchTab('invoices')">عرض الكل</button></div>
      ${recentInvoices.length === 0 ? '<div class="empty"><div class="empty-icon">🧾</div>لا توجد فواتير بعد</div>' : `
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>رقم الفاتورة</th><th>المورد</th><th>المشروع</th><th>المبلغ</th><th>التاريخ</th></tr></thead>
          <tbody>${recentInvoices.map(inv => {
            const proj = DATA.projects.find(p=>p.id===inv.project_id);
            return `<tr><td><b>${inv.invoice_no||'-'}</b></td><td>${inv.supplier_name||'-'}</td><td>${proj?.name||'-'}</td><td><b style="color:var(--orange);">${fmt(inv.total)} ${SAR}</b></td><td>${inv.date||'-'}</td></tr>`;
          }).join('')}</tbody>
        </table>
      </div>`}
    </div>
  `;
}

        ${DATA.projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
      </select>
    </div>

      <div class="tbl-wrap">
        <table id="invoices-table">

          <tbody id="invoices-tbody">${renderInvoiceRows(invs)}</tbody>
        </table>

function renderInvoiceRows(invs) {
  if(invs.length === 0) return `<tr><td colspan="11"><div class="empty"><div class="empty-icon">🧾</div>لا توجد فواتير</div></td></tr>`;
  return invs.map(inv => {
    const proj = DATA.projects.find(p=>p.id===inv.project_id);
    const line = DATA.lines.find(l=>l.id===inv.line_id);
    return `<tr>
      <td><b>${inv.invoice_no||'-'}</b></td>
      <td>${inv.supplier_name||'-'}</td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${inv.description||'-'}</td>
      <td>${proj?.name||'-'}</td>
      <td>${line?.category||'-'}</td>
      <td>${inv.vehicle_plate||'-'}</td>
      <td>${fmt(inv.amount)}</td>
      <td>${fmt(inv.tax)}</td>
      <td><b style="color:var(--orange);">${fmt(inv.total)} ${SAR}</b></td>
      <td>${inv.date||'-'}</td>
      <td><button class="btn btn-danger btn-sm" onclick="deleteInvoice('${inv.id}')">حذف</button></td>
    </tr>`;
  }).join('');
}

let invoiceFilter = '';
let invoiceProjectFilter = '';

function filterInvoices(q) {
  invoiceFilter = q.toLowerCase();
  applyInvoiceFilter();
}

function filterInvoicesByProject(pid) {
  invoiceProjectFilter = pid;
  applyInvoiceFilter();
}

function applyInvoiceFilter() {
  let filtered = DATA.invoices;
  if(invoiceFilter) filtered = filtered.filter(i =>
    (i.invoice_no||'').toLowerCase().includes(invoiceFilter) ||
    (i.supplier_name||'').toLowerCase().includes(invoiceFilter) ||
    (i.description||'').toLowerCase().includes(invoiceFilter)
  );
  if(invoiceProjectFilter) filtered = filtered.filter(i => i.project_id === invoiceProjectFilter);
  document.getElementById('invoices-tbody').innerHTML = renderInvoiceRows(filtered);
}

        </div>
        <div class="grid3">

          <div class="form-group"><label class="lbl">ض.ق.م 15%</label><input class="inp" type="number" id="ni-tax" placeholder="0" readonly style="background:#f0f0f0;"></div>
          <div class="form-group"><label class="lbl">الإجمالي</label><input class="inp" type="number" id="ni-total" placeholder="0" readonly style="background:#f0f0f0;font-weight:800;"></div>
        </div>
        <div class="form-group"><label class="lbl">العهدة (اختياري)</label>
          <select class="sel" id="ni-custody">
            <option value="">— بدون عهدة —</option>
            ${DATA.custodies.filter(c=>c.status==='open').map(c=>`<option value="${c.id}">${c.employee_name} — ${fmt(c.amount)} ${SAR}</option>`).join('')}
          </select>

function loadLinesForInvoice() {
  const pid = document.getElementById('ni-project').value;
  const lines = DATA.lines.filter(l=>l.project_id===pid);
  document.getElementById('ni-line').innerHTML = `<option value="">اختر البند</option>${lines.map(l=>`<option value="${l.id}">${l.category}</option>`).join('')}`;
}

function calcInvoiceTax() {
  const amount = parseFloat(document.getElementById('ni-amount').value)||0;
  const tax = amount * 0.15;
  document.getElementById('ni-tax').value = tax.toFixed(2);
  document.getElementById('ni-total').value = (amount+tax).toFixed(2);
}

async function saveInvoice() {
  const invoice_no = document.getElementById('ni-no').value;
  const supplier_name = document.getElementById('ni-supplier').value;
  const description = document.getElementById('ni-desc').value;
  const project_id = document.getElementById('ni-project').value || null;
  const line_id = document.getElementById('ni-line').value || null;
  const vehicle_plate = document.getElementById('ni-vehicle').value;
  const amount = parseFloat(document.getElementById('ni-amount').value)||0;
  const tax = parseFloat(document.getElementById('ni-tax').value)||0;
  const total = parseFloat(document.getElementById('ni-total').value)||0;
  const date = document.getElementById('ni-date').value;
  const custody_id = document.getElementById('ni-custody').value || null;

  if(!supplier_name || !amount) return showToast('يرجى إدخال المورد والمبلغ', 'error');

  // Check vehicle belongs to project
  if(vehicle_plate && project_id) {
    const vehicle = DATA.vehicles.find(v=>v.plate_number===vehicle_plate);
    if(vehicle && vehicle.project_id && vehicle.project_id !== project_id) {
      if(!confirm(`⚠️ السيارة "${vehicle_plate}" مسجلة في مشروع آخر. هل تريد المتابعة؟`)) return;
    }
  }

  const { data, error } = await sb.from('invoices').insert([{
    invoice_no, supplier_name, description, project_id, line_id,
    vehicle_plate, amount, tax, total, date, custody_id
  }]).select();

  if(error) return showToast('خطأ في الحفظ: ' + error.message, 'error');
  DATA.invoices.unshift(data[0]);
  closeModal();
  updateKPIs();
  renderMain();
  showToast('✅ تم حفظ الفاتورة');
}

async function deleteInvoice(id) {
  if(!confirm('هل تريد حذف هذه الفاتورة؟')) return;
  const { error } = await sb.from('invoices').delete().eq('id', id);
  if(error) return showToast('خطأ في الحذف', 'error');
  DATA.invoices = DATA.invoices.filter(i=>i.id!==id);
  renderMain();
  updateKPIs();
  showToast('✅ تم الحذف');
}

async function uploadSupplierFiles(event, supplierId) {
  const files = Array.from(event.target.files);
  if(!files.length) return;

async function handleSupplierFileDrop(event, supplierId) {
  const files = Array.from(event.dataTransfer.files);
  if(!files.length) return;
  await doUploadSupplierFiles(files, supplierId);
}

async function doUploadSupplierFiles(files, supplierId) {
  const progress = document.getElementById('sf-upload-progress');
  const bar = document.getElementById('sf-progress-bar');
  const txt = document.getElementById('sf-progress-text');
  if(progress) progress.style.display='block';

  for(let i=0; i<files.length; i++) {
    const file = files[i];
    if(file.size > 10*1024*1024) { showToast(`الملف ${file.name} أكبر من 10MB`, 'error'); continue; }
    if(bar) bar.style.width = ((i/files.length)*50)+'%';
    if(txt) txt.textContent = `جاري رفع ${file.name}...`;

    const ext = file.name.split('.').pop();
    const filePath = `suppliers/${supplierId}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;

    const { error: upErr } = await sb.storage.from('attachments').upload(filePath, file, {upsert:true});
    if(upErr) { showToast('خطأ في رفع الملف: '+upErr.message, 'error'); continue; }

    if(bar) bar.style.width = ((i/files.length)*50+50)+'%';
    const { data, error: dbErr } = await sb.from('supplier_files').insert([{

          </label>
        </div>
        <div id="ef-progress" style="display:none;margin-bottom:12px;">
          <div style="font-size:13px;color:var(--text3);margin-bottom:4px;">جاري الرفع...</div>
          <div style="background:var(--border);border-radius:50px;height:6px;">

        <div id="ef-file-list">
          ${files.length===0 ? '<div style="text-align:center;color:var(--text3);padding:16px;">لا توجد وثائق مرفقة</div>' :
            files.map(f=>`
              <div style="display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:8px;margin-bottom:8px;">
                <span style="font-size:22px;">${fileIcon(f.file_name)}</span>
                <div style="flex:1;min-width:0;">
                  <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${f.file_name}</div>
                  <div style="font-size:11px;color:var(--text3);">${f.file_size?(f.file_size/1024/1024).toFixed(2)+' MB':''} · ${f.uploaded_at?new Date(f.uploaded_at).toLocaleDateString('ar-SA'):''}</div>
                </div>
                <a href="${SUPABASE_URL}/storage/v1/object/public/attachments/${f.file_path}" target="_blank" class="btn btn-secondary btn-sm">⬇️ تحميل</a>
                <button class="btn btn-sm" style="color:var(--red);border:1px solid var(--red)" onclick="deleteEmployeeFile('${f.id}','${f.file_path}','${employeeId}','${employeeName.replace(/'/g,"\\'")}')">🗑️</button>
              </div>`).join('')}
        </div>
      </div>
    </div>
  `);
}

async function doUploadEmployeeFiles(files, employeeId, employeeName) {
  if(!files||files.length===0) return;
  const prog=document.getElementById('ef-progress');
  const bar=document.getElementById('ef-progress-bar');
  if(prog) prog.style.display='block';
  let done=0;
  for(const file of files){
    const safeName=file.name.replace(/[^a-zA-Z0-9._\u0600-\u06FF-]/g,'_');
    const filePath=`employees/${employeeId}/${Date.now()}_${safeName}`;
    const {error:upErr}=await sb.storage.from('attachments').upload(filePath,file,{upsert:true});
    if(upErr){showToast('خطأ في رفع: '+file.name,'error');continue;}
    const {data,error:dbErr}=await sb.from('employee_files').insert([{
      employee_id:employeeId, file_name:file.name, file_path:filePath,
      file_size:file.size, file_type:file.type, uploaded_at:new Date().toISOString()
    }]).select();
    if(!dbErr&&data) DATA.employee_files.push(data[0]);
    done++;
    if(bar) bar.style.width=(done/files.length*100)+'%';
  }
  if(prog) prog.style.display='none';
  showToast(`✅ تم رفع ${done} ملف`);
  openEmployeeFiles(employeeId, employeeName);
  renderMain();
}

async function deleteEmployeeFile(fileId, filePath, employeeId, employeeName) {
  if(!confirm('حذف هذا الملف؟')) return;
  await sb.storage.from('attachments').remove([filePath]);
  await sb.from('employee_files').delete().eq('id',fileId);
  DATA.employee_files = DATA.employee_files.filter(f=>f.id!==fileId);
  showToast('✅ تم حذف الملف');
  openEmployeeFiles(employeeId, employeeName);
  renderMain();
}

                  <div style="font-size:11px;color:var(--text3);">${f.file_size ? (f.file_size/1024/1024).toFixed(2)+' MB' : ''} · ${f.uploaded_at ? new Date(f.uploaded_at).toLocaleDateString('ar-SA') : ''}</div>
                </div>
                <a href="${SUPABASE_URL}/storage/v1/object/public/attachments/${f.file_path}" target="_blank" class="btn btn-secondary btn-sm">⬇️ تحميل</a>
                <button class="btn btn-sm" style="color:var(--red);border:1px solid var(--red)" onclick="deleteContractFile('${f.id}','${f.file_path}','${contractId}','${contractName.replace(/'/g,"\\'")}')">🗑️</button>
              </div>`).join('')}

async function doUploadContractFiles(files, contractId, contractName) {
  if(!files || files.length===0) return;
  const prog = document.getElementById('cf-progress');
  const bar = document.getElementById('cf-progress-bar');
  if(prog) prog.style.display='block';
  let done = 0;
  for(const file of files) {
    const safeName = file.name.replace(/[^a-zA-Z0-9._\u0600-\u06FF-]/g,'_');
    const filePath = `contracts/${contractId}/${Date.now()}_${safeName}`;
    const { error: upErr } = await sb.storage.from('attachments').upload(filePath, file, {upsert:true});
    if(upErr) { showToast('خطأ في رفع: '+file.name, 'error'); continue; }
    const { data, error: dbErr } = await sb.from('contract_files').insert([{
      contract_id: contractId,
      file_name: file.name,
      file_path: filePath,
      file_size: file.size,
      file_type: file.type,
      uploaded_at: new Date().toISOString()
    }]).select();
    if(!dbErr && data) DATA.contract_files.push(data[0]);
    done++;
    if(bar) bar.style.width = (done/files.length*100)+'%';
  }
  if(prog) prog.style.display='none';
  showToast(`✅ تم رفع ${done} ملف`);
  openContractFiles(contractId, contractName);
  renderMain();
}

async function deleteContractFile(fileId, filePath, contractId, contractName) {
  if(!confirm('حذف هذا الملف؟')) return;
  await sb.storage.from('attachments').remove([filePath]);
  const { error } = await sb.from('contract_files').delete().eq('id', fileId);
  if(error) return showToast('خطأ: '+error.message, 'error');
  DATA.contract_files = DATA.contract_files.filter(f=>f.id!==fileId);
  showToast('✅ تم حذف الملف');
  openContractFiles(contractId, contractName);
  renderMain();
}

let reportMonth = new Date().toISOString().slice(0,7);

function monthlyReportHTML() {
  return `

      </div>
    </div>
    ${buildMonthlyReport(reportMonth)}
  `;

function buildMonthlyReport(month) {
  const invoices = DATA.invoices.filter(i=>i.date?.startsWith(month));
  const totalInv = invoices.reduce((s,i)=>s+(i.total||0),0);
  const contracts = DATA.contracts;
  const totalRent = contracts.reduce((s,c)=>s+(c.payment_amount||0),0);
  const employees = DATA.employees.filter(e=>e.status==='active'||!e.status);
  const totalSalaries = employees.reduce((s,e)=>s+(e.salary||0),0);
  const custodies = DATA.custodies.filter(c=>c.created_at?.startsWith(month));
  const totalCust = custodies.reduce((s,c)=>s+(c.amount||0),0);
  const extracts = DATA.extracts.filter(e=>e.date?.startsWith(month));
  const totalExtr = extracts.reduce((s,e)=>s+(e.amount||0),0);
  const deducts = DATA.deduct_statements.filter(d=>d.date?.startsWith(month));
  const totalDeduct = deducts.reduce((s,d)=>s+(d.amount||0),0);

  const byProj = {};
  invoices.forEach(i=>{
    const p=DATA.projects.find(pr=>pr.id===i.project_id);
    const k=p?.name||'غير محدد';
    if(!byProj[k]) byProj[k]={count:0,total:0};
    byProj[k].count++; byProj[k].total+=i.total||0;
  });

  const monthLabel = new Date(month+'-01').toLocaleDateString('ar-SA',{year:'numeric',month:'long'});

  return `
    <div id="monthly-report-content">
      <div style="text-align:center;margin-bottom:24px;padding:20px;background:linear-gradient(135deg,var(--orange),var(--orange2));border-radius:16px;color:#fff;">
        <div style="font-size:28px;margin-bottom:4px;">📅</div>
        <div style="font-size:22px;font-weight:800;">التقرير الشهري</div>
        <div style="font-size:15px;opacity:.9;">${monthLabel}</div>
      </div>

      <div class="grid4" style="margin-bottom:24px;">
        <div class="stat-card" style="--accent:var(--orange);">
          <div class="stat-label">فواتير الشهر</div>
          <div class="stat-val">${fmt(totalInv)}</div>
          <div class="stat-sub">${invoices.length} فاتورة</div>
        </div>
        <div class="stat-card" style="--accent:#059669;">
          <div class="stat-label">إجمالي الرواتب</div>
          <div class="stat-val">${fmt(totalSalaries)}</div>
          <div class="stat-sub">${employees.length} موظف</div>
        </div>
        <div class="stat-card" style="--accent:#d97706;">
          <div class="stat-label">إيجارات العقود</div>
          <div class="stat-val">${fmt(totalRent)}</div>
          <div class="stat-sub">${contracts.length} عقد</div>
        </div>
        <div class="stat-card" style="--accent:#7c3aed;">
          <div class="stat-label">مستخلصات الشهر</div>
          <div class="stat-val">${fmt(totalExtr)}</div>
          <div class="stat-sub">${extracts.length} مستخلص</div>
        </div>
      </div>

      <div class="grid2" style="margin-bottom:24px;">
        <div class="card">
          <div class="section-title" style="margin-bottom:12px;">🧾 الفواتير حسب المشروع</div>
          ${Object.keys(byProj).length===0?'<div class="empty" style="padding:20px">لا توجد فواتير هذا الشهر</div>':`
          <div class="tbl-wrap"><table>
            <thead><tr><th>المشروع</th><th>عدد الفواتير</th><th>الإجمالي</th></tr></thead>
            <tbody>${Object.entries(byProj).sort((a,b)=>b[1].total-a[1].total).map(([k,v])=>`
              <tr><td><b>${k}</b></td><td>${v.count}</td><td><b style="color:var(--orange)">${fmt(v.total)} ${SAR}</b></td></tr>`).join('')}
            </tbody>

// EMPLOYEE REPORT
// ============================================
function empReportHTML() {
  const activeEmps = DATA.employees.filter(e => e.status === 'active');
  const byNat = {};
  DATA.employees.forEach(e => {
    const k = e.nationality || 'غير محدد';
    if (!byNat[k]) byNat[k] = 0;
    byNat[k]++;
  });

  return `
    <div class="section-header">
      <div class="section-title">👤 تقرير الموظفين التفصيلي</div>
      <button class="btn btn-secondary" onclick="printEmpReport()">🖨️ طباعة</button>
    </div>
    <div class="grid4" style="margin-bottom:24px;">
      <div class="stat-card" style="--accent:var(--orange);">
        <div class="stat-label">إجمالي الموظفين</div>
        <div class="stat-val">${DATA.employees.length}</div>
      </div>
      <div class="stat-card" style="--accent:var(--green);">
        <div class="stat-label">نشطين</div>
        <div class="stat-val">${activeEmps.length}</div>
      </div>
      <div class="stat-card" style="--accent:#7c3aed;">
        <div class="stat-label">إجمالي الرواتب</div>
        <div class="stat-val">${fmt(DATA.employees.reduce((s,e)=>s+(e.salary||0),0))}</div>
        <div class="stat-sub">${SAR} / شهر</div>
      </div>
      <div class="stat-card" style="--accent:#0284c7;">
        <div class="stat-label">الجنسيات</div>
        <div class="stat-val">${Object.keys(byNat).length}</div>
      </div>
    </div>

    <div class="grid2" style="margin-bottom:20px;">
      <div class="card">
        <div style="font-weight:800;margin-bottom:14px;">توزيع الموظفين بالمشاريع</div>
        ${DATA.projects.map(p => {
          const emps = DATA.employees.filter(e => e.project_id === p.id);
          return emps.length === 0 ? '' : `
            <div style="margin-bottom:10px;">
              <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
                <span>${p.name}</span><span><b>${emps.length} موظف</b></span>
              </div>
              <div style="background:var(--bg);border-radius:50px;height:6px;">
                <div style="background:var(--orange);height:6px;border-radius:50px;width:${Math.min(100,emps.length/DATA.employees.length*100)}%;"></div>
              </div>
            </div>`;
        }).join('')}
      </div>
      <div class="card">
        <div style="font-weight:800;margin-bottom:14px;">توزيع الجنسيات</div>
        ${Object.entries(byNat).sort((a,b)=>b[1]-a[1]).map(([nat,cnt]) => `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <span style="font-size:13px;">${nat}</span>
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="background:var(--bg);border-radius:50px;height:6px;width:120px;">
                <div style="background:var(--orange);height:6px;border-radius:50px;width:${Math.min(100,cnt/DATA.employees.length*100)}%;"></div>
              </div>
              <span class="badge badge-orange">${cnt}</span>
            </div>
          </div>`).join('')}
      </div>
    </div>

    <div class="card" id="emp-report-table">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div style="font-weight:800;">كشف الموظفين التفصيلي</div>
        <input class="search-inp" style="width:240px;" placeholder="🔍 بحث..." oninput="filterEmpReport(this.value)">
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>#</th><th>الاسم</th><th>رقم الإقامة</th><th>الجنسية</th><th>المسمى الوظيفي</th><th>المشروع</th><th>الراتب</th><th>الجوال</th><th>الحالة</th></tr></thead>
          <tbody id="emp-report-body">${renderEmpRows(DATA.employees)}</tbody>
        </table>
      </div>
    </div>
  `;
}

function renderEmpRows(emps) {
  if (emps.length === 0) return `<tr><td colspan="9"><div class="empty"><div class="empty-icon">👥</div>لا يوجد موظفين</div></td></tr>`;
  return emps.map((e, i) => {
    const proj = DATA.projects.find(p => p.id === e.project_id);
    return `<tr>
      <td style="color:var(--text3);">${i+1}</td>
      <td><b>${e.name}</b></td>
      <td>${e.iqama || '-'}</td>
      <td>${e.nationality || '-'}</td>
      <td>${e.job_title || '-'}</td>
      <td>${proj?.name || '-'}</td>
      <td><b style="color:var(--orange);">${fmt(e.salary)} ${SAR}</b></td>
      <td>${e.phone || '-'}</td>
      <td><span class="badge ${e.status==='active'?'badge-green':'badge-gray'}">${e.status==='active'?'نشط':'منتهي'}</span></td>
    </tr>`;
  }).join('');
}

function filterEmpReport(q) {
  const filtered = DATA.employees.filter(e =>
    (e.name||'').includes(q) ||
    (e.iqama||'').includes(q) ||
    (e.nationality||'').includes(q) ||
    (e.job_title||'').includes(q)
  );
  const tbody = document.getElementById('emp-report-body');
  if (tbody) tbody.innerHTML = renderEmpRows(filtered);
}

function printEmpReport() {
  window.print();
}
